[package]
name = "hameaux-server"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
hameaux-core = { version = "0.1.0", path = "../hameaux-core" }
hameaux-protocol = { version = "0.1.0", path = "../hameaux-protocol" }
tokio = { version = "1.54.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["compression-gzip", "fs", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
hameaux-worldgen = { version = "0.1.0", path = "../hameaux-worldgen" }
